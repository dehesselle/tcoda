[project]
name = "tcw"
dynamic = ["version"]
description = "Textual Common Widgets: a menu bar and a settings system shared across Textual apps"
readme = "README.md"
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = ["platformdirs>=4.11.0", "textual>=8.2.8,<9"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tcw/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The UI tests are all async; auto mode saves marking every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[project]
name = "tcoda"
dynamic = ["version"]
description = "Textual coda: widgets, dialogs and helpers"
readme = "README.md"
license = "0BSD AND MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "René de Hesselle", email = "dehesselle@web.de" }]
requires-python = ">=3.12"
dependencies = [
    # Temporary: tcoda.plot brought numpy along and is to be freed of it.
    "numpy>=2.2.1",
    "platformdirs>=4.11.0",
    "textual>=8.2.8,<9",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tcoda/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The UI tests are all async; auto mode saves marking every one of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.ruff]
# Ruff comes from outside the project, and its defaults change between minor
# releases; bump this once a new minor's findings have been reviewed, together
# with the pin in .github/workflows/build.yml.
required-version = "~=0.16.0"
